[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP server for OpenWebUI: Neo4j citation graph and arXiv tools"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.0",
    "fastmcp>=3.0.0b1",
    "httpx>=0.27.0",
    "neo4j>=5.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
